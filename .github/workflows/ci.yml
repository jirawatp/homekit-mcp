name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  typescript:
    timeout-minutes: 15
    # Synthetic, read-only checks only: no HomeKit, device, credential or network listener is used.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build, test and enforce 90% coverage on all production TypeScript
        run: npm test
      - name: Prove the coverage gate fails when a threshold is raised
        # Reuses the V8 data written by `npm test`; does not rerun the suite.
        run: |
          rc=0
          output=$(npx --no c8 report --lines 101 --reporter=text-summary 2>&1) || rc=$?
          test "$rc" -ne 0
          printf '%s\n' "$output" | grep -q 'does not meet global threshold (101%)'
      - name: Native coverage gate regression tests (pure Node)
        run: npm run test:gates
      - name: Synthetic MCP smoke
        run: npm run smoke
      - run: npm audit --omit=dev --audit-level=high
  native-core:
    timeout-minutes: 20
    # Foundation-only BridgeCore tests and coverage. Does not build, sign or launch the Catalyst app.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Native coverage gate regression tests (pure Node)
        run: npm run test:gates
      - name: Swift BridgeCore tests with 90% lines/functions/regions gate
        run: npm run coverage:native
      - name: Build Foundation-only fixture and run synthetic bridge smoke
        run: npm run smoke:native
